name: Build VLC Windows x64

on:
  push:
    branches:
      - fix/qt-toolbar-hidpi
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: win64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win64:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    # Same win64 build environment as VLC 3.0's upstream GitLab CI.
    container:
      image: registry.videolan.org/vlc-debian-win64-3.0:20260820114402
      # VLC's build image uses a non-root user; checkout needs write access
      # to GitHub Actions' mounted temp/file-command directories.
      options: --user 0:0

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The host runner owns the checkout, but the build container runs as root.
      # actions/checkout configures safe.directory only with a temporary HOME.
      - name: Mark checkout as a safe Git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Find matching prebuilt contribs
        run: |
          set -euo pipefail

          contrib_sha="$(extras/ci/get-contrib-sha.sh win64)"
          contrib_url="https://artifacts.videolan.org/vlc-3.0/win64/vlc-contrib-x86_64-w64-mingw32-${contrib_sha}.tar.zst"

          if extras/ci/check-url.sh "$contrib_url"; then
            echo "VLC_PREBUILT_CONTRIBS_URL=$contrib_url" >> "$GITHUB_ENV"
            echo "USE_PREBUILT=yes" >> "$GITHUB_ENV"
          else
            echo "USE_PREBUILT=no" >> "$GITHUB_ENV"
          fi

      - name: Build VLC with Qt (Windows x64)
        run: |
          set -euo pipefail

          build_flags=()
          if [[ "${USE_PREBUILT}" == "yes" ]]; then
            build_flags+=(-p)
          fi

          mkdir -p build
          cd build

          # build.sh defaults to Debug. Set RELEASE=yes to select its
          # production configuration without -r's automatic NSIS installer
          # packaging; we package the portable build separately below.
          export RELEASE=yes
          export CONFIGFLAGS="--disable-debug --enable-optimizations"
          # -l enables gettext/NLS, including zh_CN translations.
          sh ../extras/package/win32/build.sh -a x86_64 -l "${build_flags[@]}"

          # Verify release assertions are disabled by the actual configure step.
          grep -Eq '^#define NDEBUG( |$)' win64/config.h

      - name: Build Windows installer (NSIS)
        run: |
          set -euo pipefail

          # VLC's official packaging target stages the application, strips
          # Windows binaries, builds the required installer helpers and
          # generates vlc-3.0.24-win64.exe.
          make -C build/win64 package-win32-exe
          test -s build/win64/vlc-3.0.24-win64.exe

      - name: Prepare portable VLC
        run: |
          set -euo pipefail

          package_dir="build/win64/vlc-3.0.24"

          # Ensure the binary and simplified Chinese UI translation are present.
          test -s "$package_dir/vlc.exe"
          test -s "$package_dir/locale/zh_CN/LC_MESSAGES/vlc.mo"

          # The upstream installer packaging already stripped Windows PE
          # binaries. Remove development and NSIS staging-only files from
          # the separate portable artifact.
          rm -rf "$package_dir/sdk" "$package_dir/NSIS" \
                 "$package_dir/languages" "$package_dir/helpers"
          rm -f "$package_dir"/*.nsi "$package_dir/spad-setup.exe"
          find "$package_dir" -type f \( -name '*.dbg' -o -name '*.pdb' \) -delete

          du -sh "$package_dir"

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: VLC-3.0.24-win64-HiDPI-Release-multilang
          path: build/win64/vlc-3.0.24/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: VLC-3.0.24-win64-HiDPI-Release-Installer
          path: build/win64/vlc-3.0.24-win64.exe
          if-no-files-found: error
          retention-days: 7
